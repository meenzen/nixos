name: "Test"
on:
  pull_request:
  push:
    branches:
      - main
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3
      - uses: DeterminateSystems/flake-checker-action@86e5a3677192f3f3eee742a7152bf1be84dee20c # main

      - name: Setup Attic cache
        uses: ryanccn/attic-action@dc99f5eb1d5c0495aa26f7b56337b30011fa153e # v0.5.2
        with:
          endpoint: https://attic.mnzn.dev
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Check flake
        run: nix flake check

      - name: Install tools
        run: nix profile install nixpkgs#direnv nixpkgs#nix-direnv

      - name: Set up direnv
        run: direnv allow

      - name: Colmena build
        run: direnv exec . colmena build --verbose --no-build-on-target
